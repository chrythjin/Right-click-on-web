<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Right-click on Web Manual Test</title>
    <style>
      body {
        max-width: 760px;
        margin: 40px auto;
        padding: 0 20px;
        color: #181818;
        font-family: "Segoe UI", Arial, sans-serif;
        line-height: 1.6;
      }

      .blocked {
        padding: 18px;
        border: 1px solid #d8d8d8;
        border-radius: 12px;
        background: #f6f6f6;
        user-select: none;
      }

      button {
        min-height: 44px;
        padding: 0 16px;
      }
    </style>
  </head>
  <body oncontextmenu="return false" onselectstart="return false" oncopy="return false">
    <h1>Manual blocked page</h1>
    <p>확장 ON 상태에서 아래 영역의 우클릭, 선택, 복사를 테스트하세요.</p>

    <section class="blocked" oncontextmenu="return false" oncopy="return false" ondragstart="return false">
      이 문장은 페이지 CSS와 inline event attribute로 선택/복사/우클릭이 막히도록 구성된 테스트 텍스트입니다.
    </section>

    <p id="dynamicTarget"></p>
    <button id="addBlocker" type="button">동적 차단 요소 추가</button>

    <script>
      document.addEventListener('contextmenu', (event) => {
        event.preventDefault();
      });

      document.addEventListener('copy', (event) => {
        event.preventDefault();
      });

      document.getElementById('addBlocker').addEventListener('click', () => {
        const element = document.createElement('span');
        element.className = 'blocked';
        element.setAttribute('oncontextmenu', 'return false');
        element.setAttribute('oncopy', 'return false');
        element.textContent = '동적으로 추가된 차단 텍스트입니다. 선택과 복사를 테스트하세요.';
        document.getElementById('dynamicTarget').replaceChildren(element);
      });
    </script>
  </body>
</html>
